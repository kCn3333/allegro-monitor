services:
  app:
    image: ghcr.io/kcn3333/allegro-monitor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb
