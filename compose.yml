services:
  app:
    image: ghcr.io/kcn3333/allegro-monitor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      PORT: ${APP_PORT:-3000}
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/monitor.sqlite
      EXTENSION_ZIP_PATH: /app/extension.zip
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Portainer}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID in Portainer}
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in Portainer}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in Portainer}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - monitor-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

volumes:
  monitor-data:
    name: allegro-monitor-data
